<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Harvest review</title>
<!--
  Fixed template for the harvest review page. scripts/report.py replaces __HARVEST_DATA__
  with the parsed ledger. The page never edits the ledger; it produces a harvest-responses/1 file.
  Offline, single file, no CDN, no framework, no web fonts.
-->
<style>
:root{
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
  --ease: cubic-bezier(.2,.75,.25,1);
  --top: 56px;
}
/* Light: bone drafting paper, petrol ink */
:root{
  --bg:#ece7dc; --grid:rgba(15,35,41,.055); --pane:#f4f1ea; --surface:#fcfbf8; --surface-2:#f3efe6; --sunk:#e6e0d3;
  --line:#dcd4c4; --line-2:#c6bca8; --ink:#0f2329; --ink-2:#3f5257; --ink-3:#5a6a6e;
  --teal:#0a7268; --teal-ink:#ffffff; --teal-soft:rgba(10,114,104,.09); --teal-line:rgba(10,114,104,.38); --teal-text:#08655c;
  --verm:#b93a14; --verm-soft:rgba(197,64,24,.08); --verm-line:rgba(185,58,20,.42);
  --ochre:#83590a; --ochre-soft:rgba(176,124,20,.12);
  --done:#4a6a62; --done-soft:rgba(74,106,98,.12);
  --sel:rgba(10,114,104,.075);
  --shadow:0 1px 0 rgba(15,35,41,.05), 0 10px 30px -14px rgba(15,35,41,.28);
  --shadow-lg:0 2px 0 rgba(15,35,41,.04), 0 30px 80px -20px rgba(15,35,41,.45);
  --scrim:rgba(20,30,32,.38);
  color-scheme: light;
}
/* Dark: petrol drafting ground, bone linework */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#081215; --grid:rgba(235,230,218,.035); --pane:#0b171b; --surface:#0f1f24; --surface-2:#14282e; --sunk:#071013;
  --line:#1d3238; --line-2:#2b464d; --ink:#ebe6da; --ink-2:#aab4af; --ink-3:#7e8c89;
  --teal:#4fd1bf; --teal-ink:#04211d; --teal-soft:rgba(79,209,191,.11); --teal-line:rgba(79,209,191,.42); --teal-text:#6fdccc;
  --verm:#ff7a52; --verm-soft:rgba(255,112,70,.11); --verm-line:rgba(255,122,82,.5);
  --ochre:#e8b964; --ochre-soft:rgba(232,185,100,.12);
  --done:#a9c4b9; --done-soft:rgba(169,196,185,.1);
  --sel:rgba(79,209,191,.07);
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 12px 30px -14px rgba(0,0,0,.7);
  --shadow-lg:0 30px 90px -20px rgba(0,0,0,.85);
  --scrim:rgba(2,8,10,.62);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg:#081215; --grid:rgba(235,230,218,.035); --pane:#0b171b; --surface:#0f1f24; --surface-2:#14282e; --sunk:#071013;
  --line:#1d3238; --line-2:#2b464d; --ink:#ebe6da; --ink-2:#aab4af; --ink-3:#7e8c89;
  --teal:#4fd1bf; --teal-ink:#04211d; --teal-soft:rgba(79,209,191,.11); --teal-line:rgba(79,209,191,.42); --teal-text:#6fdccc;
  --verm:#ff7a52; --verm-soft:rgba(255,112,70,.11); --verm-line:rgba(255,122,82,.5);
  --ochre:#e8b964; --ochre-soft:rgba(232,185,100,.12);
  --done:#a9c4b9; --done-soft:rgba(169,196,185,.1);
  --sel:rgba(79,209,191,.07);
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 12px 30px -14px rgba(0,0,0,.7);
  --shadow-lg:0 30px 90px -20px rgba(0,0,0,.85);
  --scrim:rgba(2,8,10,.62);
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv11","ss01"}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
code,kbd,.mono{font-family:var(--mono);font-size:.86em;font-feature-settings:normal}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
::selection{background:var(--teal-soft)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;font-size:10.5px;line-height:1;color:var(--ink-3);background:var(--surface)}

/* ---------------------------------------------------------------- app shell */
.app{display:grid;grid-template-rows:var(--top) auto minmax(0,1fr);height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:18px;padding:0 14px 0 18px;border-bottom:1px solid var(--line);background:var(--pane);position:relative;z-index:5;min-width:0}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand .word{font-weight:500;font-size:19px;letter-spacing:-.02em}
.brand .reg{color:var(--verm);width:18px;height:18px}
.refs{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--ink-2);min-width:0;flex:0 1 auto;white-space:nowrap}
.refs .ref{overflow:hidden;text-overflow:ellipsis}
.refs .arrow{color:var(--ink-3)}
.round{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--teal-text);border:1px solid var(--teal-line);border-radius:99px;padding:1px 8px;white-space:nowrap}
.views{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--sunk);flex:none}
.views button{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:7px;color:var(--ink-2);font-size:13px;font-weight:500}
.views button:hover{color:var(--ink)}
.views button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.views .n{font-family:var(--mono);font-size:10.5px;color:var(--verm)}
.grow{flex:1;min-width:0}
.progress{display:flex;align-items:center;gap:10px;min-width:0}
.segs{display:flex;gap:2px;height:14px;align-items:stretch;width:clamp(120px,16vw,260px)}
.seg{flex:1;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);position:relative;transition:background .25s var(--ease),box-shadow .25s}
.seg.picked{background:var(--teal);box-shadow:none}
.seg.left{background:var(--ink-3);opacity:.55;box-shadow:none}
.seg.landed{background:var(--done);opacity:.75;box-shadow:none}
.seg.warn::after{content:"";position:absolute;left:0;right:0;top:-4px;height:2px;border-radius:2px;background:var(--verm)}
.seg.cur{outline:1.5px solid var(--ink);outline-offset:1px}
.seg:hover{filter:brightness(1.15)}
.ptext{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.ptext b{color:var(--ink);font-weight:600}
.saved{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.saved.bad{color:var(--verm)}
.ibtn{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--ink-2);flex:none}
.ibtn:hover{background:var(--sunk);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--verm);border-color:var(--verm-line)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn kbd{margin-left:2px;background:transparent;border:0;opacity:.7;color:inherit;font-size:11px;min-width:0;padding:0}
.send.ready{animation:glow 2.4s var(--ease) 1}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--teal-line)}40%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.notices{display:flex;flex-direction:column}
.notice{display:flex;gap:10px;align-items:flex-start;padding:8px 18px;font-size:13px;border-bottom:1px solid var(--line);background:var(--verm-soft);color:var(--ink)}
.notice .i{color:var(--verm);margin-top:2px}
.notice details summary{cursor:pointer;color:var(--ink-2)}
.notice ul{margin:4px 0 0 16px;padding:0;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.notice .x{margin-left:auto;color:var(--ink-3)}

main{min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;min-height:0}
.app[data-view="review"] .view-review,.app[data-view="map"] .view-map,.app[data-view="plan"] .view-plan{display:grid}

/* ---------------------------------------------------------------- review: list pane */
.view-review{grid-template-columns:clamp(300px,31vw,410px) minmax(0,1fr)}
.lpane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--pane)}
.lhead{padding:12px 12px 8px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3)}
.search:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);height:100%}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip .c{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--pane)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.7}
.chip.attn .c{color:var(--verm)}
.chip.attn[aria-pressed="true"]{background:var(--verm);border-color:var(--verm);color:#fff}
.chip.new .c{color:var(--teal-text)}
.roundnote{display:flex;gap:10px;align-items:center;margin:10px 12px 2px;padding:9px 11px;border-radius:9px;background:var(--teal-soft);border:1px solid var(--teal-line);font-size:12.5px;color:var(--ink)}
.roundnote .spark{color:var(--teal-text)}
.roundnote button{margin-left:auto;color:var(--teal-text);font-weight:600;font-size:12.5px;white-space:nowrap}
.list{flex:1;overflow:auto;padding:4px 0 24px;scroll-padding:40px 0}
.grp{position:sticky;top:0;z-index:1;display:flex;align-items:baseline;gap:8px;padding:12px 16px 6px;background:var(--pane);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.grp .hint{font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;font-size:11px;opacity:.8}
.grp::after{content:"";flex:1;border-top:1px dashed var(--line-2);transform:translateY(-3px)}
.row{position:relative;display:grid;grid-template-columns:16px 38px minmax(0,1fr) auto;align-items:start;column-gap:8px;padding:9px 14px 9px 14px;margin:1px 6px;border-radius:9px;cursor:pointer;user-select:none;transition:background .12s}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--surface);box-shadow:0 0 0 1px var(--line-2),var(--shadow)}
.row.sel::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--teal)}
.row .node{margin-top:4px}
.rid{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:1px;white-space:nowrap}
.row.sel .rid{color:var(--ink)}
.rmain{min-width:0}
.rtitle{display:block;font-weight:500;font-size:13.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:12px;color:var(--ink-3);white-space:nowrap;min-width:0}
.rsub .dec{overflow:hidden;text-overflow:ellipsis}
.rsub .dec.picked{color:var(--teal-text)}
.rsub .dec .b{font-family:var(--mono);font-size:11px;opacity:.85}
.row.s-left .rtitle{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.row.s-landed .rtitle,.row.s-aside .rtitle{color:var(--ink-2)}
.rflags{display:flex;gap:6px;align-items:center;margin-top:2px;color:var(--ink-3);font-size:11.5px;font-family:var(--mono)}
.rflags .w{color:var(--verm)}
.rflags .q{display:flex;align-items:center;gap:2px}
.rflags .ed{width:6px;height:6px;border-radius:1px;transform:rotate(45deg);background:var(--ink-2)}
.newdot{width:7px;height:7px;border-radius:99px;background:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.fitm{font-size:11px;padding:0 6px;border-radius:4px;line-height:17px}
.fit-aligned{color:var(--ink-3)}
.fit-tension{color:var(--ochre);background:var(--ochre-soft)}
.fit-conflict{color:var(--verm);background:var(--verm-soft)}
.rel{position:absolute;right:100%;top:50%;transform:translate(10px,-50%);font-size:10px;color:var(--teal-text);opacity:0}
.row.rel-up,.row.rel-down{background:var(--sel)}
.row.rel-up .relmark,.row.rel-down .relmark{opacity:1}
.relmark{position:absolute;left:0;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--teal-text);opacity:0;width:12px;text-align:center}
.empty{padding:30px 20px;text-align:center;color:var(--ink-3);font-size:13px}

/* state nodes (shared) */
.node{display:inline-block;width:12px;height:12px;border-radius:99px;flex:none;position:relative;box-shadow:inset 0 0 0 1.5px var(--ink-3);transition:transform .25s var(--ease),background .2s,box-shadow .2s}
.node.picked{background:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.node.left{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.node.left::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:1.5px;background:var(--ink-3);transform:rotate(-45deg)}
.node.landed{background:var(--done);box-shadow:inset 0 0 0 1.5px var(--done)}
.node.landed::after{content:"";position:absolute;left:3.6px;top:2px;width:3px;height:6px;border:solid var(--pane);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.node.aside{background:transparent;box-shadow:inset 0 0 0 1.5px var(--done);opacity:.7}
.node.warn{box-shadow:inset 0 0 0 1.5px var(--teal),0 0 0 3px var(--verm-soft),0 0 0 1.5px var(--verm)}
.node.pop{animation:pop .35s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---------------------------------------------------------------- review: detail pane */
.dpane{display:flex;flex-direction:column;min-height:0;min-width:0;
  background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.dscroll{flex:1;overflow:auto;padding:28px 32px 40px;scroll-behavior:auto}
.sheet{position:relative;max-width:840px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:30px 38px 34px}
.regm{position:absolute;width:14px;height:14px;color:var(--verm);opacity:.75;pointer-events:none}
.regm.tl{left:-7px;top:-7px}.regm.tr{right:-7px;top:-7px}.regm.bl{left:-7px;bottom:-7px}.regm.br{right:-7px;bottom:-7px}
.back{display:none}
.kicker{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:12px}
.kicker .eid{color:var(--ink);font-weight:600;font-size:13px}
.kicker .rule{flex:1;border-top:1px dashed var(--line-2)}
.kicker .nav{display:flex;gap:2px}
.kicker .nav button{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--ink-3)}
.kicker .nav button:hover{background:var(--sunk);color:var(--ink)}
.kicker .nav button[disabled]{opacity:.3;cursor:default;background:none}
h2.title{font-size:27px;line-height:1.18;letter-spacing:-.022em;font-weight:600;margin:0 0 10px;text-wrap:balance}
.lede{font-size:16px;line-height:1.55;color:var(--ink-2);margin:0;text-wrap:pretty}
.why{margin:18px 0 0;padding:2px 0 2px 16px;border-left:2px solid var(--line-2);font-size:14px;color:var(--ink-2)}
.why .lbl{display:block;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.why q{font-style:italic;color:var(--ink);quotes:"\201C" "\201D"}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:18px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.stats .add{color:var(--teal-text)} .stats .del{color:var(--verm)}
.dstat{display:inline-flex;gap:2px;margin-left:6px;vertical-align:-1px}
.dstat i{width:8px;height:8px;border-radius:1.5px;background:var(--line)}
.dstat i.a{background:var(--teal)} .dstat i.d{background:var(--verm)}
.sizebar{display:inline-block;width:70px;height:4px;border-radius:2px;background:var(--line);vertical-align:middle;margin-left:6px;position:relative;overflow:hidden}
.sizebar i{position:absolute;inset:0 auto 0 0;background:var(--ink-3);border-radius:2px}
.sec{margin-top:28px}
.sech{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.sech::after{content:"";flex:1;border-top:1px solid var(--line)}
.sech .c{font-family:var(--mono);letter-spacing:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.card{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--surface)}
.fitcard{display:flex;flex-direction:column;gap:6px}
.fitbadge{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.fitbadge .dot{width:8px;height:8px;border-radius:99px}
.fitcard.aligned .fitbadge{color:var(--teal-text)} .fitcard.aligned .dot{background:var(--teal)}
.fitcard.tension{border-color:color-mix(in srgb,var(--ochre) 35%,var(--line));background:var(--ochre-soft)} .fitcard.tension .fitbadge{color:var(--ochre)} .fitcard.tension .dot{background:var(--ochre)}
.fitcard.conflict{border-color:var(--verm-line);background:var(--verm-soft)} .fitcard.conflict .fitbadge{color:var(--verm)} .fitcard.conflict .dot{background:var(--verm)}
.fitcard p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink)}
.fitcard .scale{display:flex;gap:3px;margin-left:auto}
.fitcard .scale i{width:16px;height:4px;border-radius:2px;background:var(--line)}
.fitcard.aligned .scale i:nth-child(1){background:var(--teal)}
.fitcard.tension .scale i:nth-child(-n+2){background:var(--ochre)}
.fitcard.conflict .scale i{background:var(--verm)}
.cite{font-family:var(--mono);font-size:.86em;padding:0 4px;border-radius:4px;background:var(--sunk);color:var(--ink);white-space:nowrap}
code{padding:0 4px;border-radius:4px;background:var(--sunk);color:var(--ink)}
.deps{display:flex;flex-direction:column;gap:2px}
.deps .dh{font-size:12px;color:var(--ink-3);margin:2px 0 4px}
.deps .dh + .dh{margin-top:10px}
.dep{display:grid;grid-template-columns:12px 36px minmax(0,1fr);gap:8px;align-items:start;padding:6px 8px;margin:0 -8px;border-radius:7px;text-align:left;width:calc(100% + 16px)}
.dep:hover{background:var(--surface-2)}
.dep .node{margin-top:4px}
.dep .rid{margin-top:1px}
.dep .t{font-size:13px;font-weight:500;line-height:1.35;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dep .why2{display:block;font-size:12px;color:var(--ink-3);line-height:1.4}
.dep .st{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.dep .st.bad{color:var(--verm)}
.dep .st.ok{color:var(--teal-text)}
.nodeps{font-size:13px;color:var(--ink-3)}

/* resolution cards */
.resolve{margin-top:22px;border:1px solid var(--verm-line);background:var(--verm-soft);border-radius:12px;padding:14px 16px;animation:rise .3s var(--ease)}
.resolve.cut{border-color:var(--line-2);background:var(--surface-2)}
.resolve.info{border-color:var(--line-2);background:var(--surface-2)}
.resolve h4{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:14px;font-weight:600}
.resolve h4 .i{color:var(--verm)}
.resolve.cut h4 .i,.resolve.info h4 .i{color:var(--ink-2)}
.resolve p{margin:0;color:var(--ink-2);font-size:13.5px}
.resolve .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.resolve textarea{margin-top:10px}
.resolve .cuttext{margin-top:6px;font-size:13.5px;color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* conversation */
.thread{display:flex;flex-direction:column;gap:14px}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.av{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.av.you{background:var(--sunk);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.av.ai{background:var(--teal-soft);color:var(--teal-text);box-shadow:inset 0 0 0 1px var(--teal-line)}
.av.ai svg{width:15px;height:15px}
.av.led{background:var(--surface-2);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.mh{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-3);margin-bottom:2px}
.mh b{color:var(--ink);font-weight:600;font-size:12.5px}
.mh .meta{font-family:var(--mono);font-size:11px}
.mh .tag{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.tag.new{background:var(--teal);color:var(--teal-ink)}
.tag.draft{background:var(--sunk);color:var(--ink-2)}
.tag.note{background:var(--ochre-soft);color:var(--ochre)}
.mb{font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.answer .mb{background:var(--teal-soft);border:1px solid var(--teal-line);border-radius:4px 12px 12px 12px;padding:9px 12px}
.msg.answer.fresh .mb{animation:fresh 2.2s var(--ease)}
@keyframes fresh{0%{box-shadow:0 0 0 0 var(--teal-line)}30%{box-shadow:0 0 0 6px transparent}}
.msg.wait .mb{border:1px dashed var(--line-2);border-radius:4px 12px 12px 12px;padding:8px 12px;color:var(--ink-3);font-size:13px}
.msg.mine .mb{background:var(--surface-2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:9px 12px}
.msg.mine .tools{display:flex;gap:2px;margin-left:auto;opacity:0;transition:opacity .12s}
.msg.mine:hover .tools,.msg.mine:focus-within .tools{opacity:1}
.msg.mine .tools button{font-size:12px;color:var(--ink-3);padding:1px 6px;border-radius:5px}
.msg.mine .tools button:hover{background:var(--sunk);color:var(--ink)}
.reply{margin-top:8px}
.composer{margin-top:16px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.composer textarea,.tarea{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:11px 13px 4px;min-height:46px;max-height:260px;line-height:1.5;font-size:14px}
.tarea{border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:9px 11px}
.tarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.composer .cbar{display:flex;align-items:center;gap:8px;padding:6px 8px 8px 13px}
.composer .hint{font-size:11.5px;color:var(--ink-3)}
.facts dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 14px;margin:0;font-size:13px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts .sha{display:inline-block;font-family:var(--mono);font-size:11.5px;padding:0 5px;border-radius:4px;background:var(--sunk);margin:0 3px 3px 0}
details.raw{margin-top:14px}
details.raw summary{cursor:pointer;font-size:12.5px;color:var(--ink-3);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.raw summary::-webkit-details-marker{display:none}
details.raw[open] summary .chev{transform:rotate(90deg)}
details.raw pre{margin:8px 0 0;padding:12px 14px;border-radius:8px;background:var(--sunk);font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.kindnote{margin-top:16px;padding:10px 13px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2);display:flex;gap:9px}

/* decision dock */
.dock{flex:none;border-top:1px solid var(--line);background:color-mix(in srgb,var(--pane) 92%,transparent);backdrop-filter:blur(8px);padding:10px 32px 12px}
.dockin{max-width:840px;margin:0 auto}
.dockl{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-3);margin-top:8px;min-height:30px}
.dockl .dl-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dockl b{color:var(--ink);font-weight:600}
.dockl .was{flex:none;font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.dockl .was button{font-family:var(--sans);font-size:12px;color:var(--teal-text);font-weight:600}
.dockr{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:1 1 auto}
.mb2{display:flex;align-items:center;gap:8px;height:40px;padding:0 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-weight:500;font-size:13.5px;transition:all .15s var(--ease);min-width:0}
.mb2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb2 kbd{margin-left:auto}
.mb2:hover{border-color:var(--teal-line);color:var(--ink)}
.mb2[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);box-shadow:0 4px 14px -6px var(--teal)}
.mb2[aria-pressed="true"] kbd{color:inherit;border-color:currentColor;background:transparent;opacity:.6}
.mb2.leave[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:var(--pane);box-shadow:none}
.batch{display:flex;align-items:center;height:30px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 4px 0 10px;flex:0 1 330px;min-width:0;animation:rise .25s var(--ease)}
.batch:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.batch label{font-size:12px;color:var(--ink-3);margin-right:8px;white-space:nowrap}
.batch .pre{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.batch input{flex:1;min-width:40px;border:0;outline:none;background:none;font-family:var(--mono);font-size:12.5px;height:100%}
.batch input::placeholder{color:var(--ink-3);opacity:.85}
.dockdone{display:flex;align-items:center;gap:10px;height:40px;font-size:13.5px;color:var(--ink-2)}
.dockdone .node{width:14px;height:14px}

/* ---------------------------------------------------------------- map */
.view-map{grid-template-columns:minmax(0,1fr) 340px}
.mapwrap{position:relative;overflow:auto;min-width:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--grid) 60%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--grid) 60%,transparent) 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px}
.canvas{position:relative;margin:58px auto 190px;}
.mapwrap > .canvas{left:0}
.canvas svg.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--line-2);stroke-width:1.4;transition:stroke .2s,opacity .2s}
.edge.ok{stroke:var(--teal);stroke-width:1.8}
.edge.bad{stroke:var(--verm);stroke-width:1.8;stroke-dasharray:5 4;animation:dash 1.2s linear infinite}
.edge.cut{stroke:var(--ink-3);stroke-dasharray:2 4}
@keyframes dash{to{stroke-dashoffset:-18}}
.arrowhead{fill:none;stroke:var(--line-2);stroke-width:1.4;transition:opacity .2s}
.arrowhead.ok{stroke:var(--teal)}.arrowhead.bad{stroke:var(--verm)}.arrowhead.cut{stroke:var(--ink-3)}
.canvas.focused .edge,.canvas.focused .arrowhead{opacity:.16}
.canvas.focused .edge.hl,.canvas.focused .arrowhead.hl{opacity:1}
.canvas.focused .edge.hl:not(.ok):not(.bad):not(.cut){stroke:var(--ink-2)}
.colh{position:absolute;left:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.mnode{position:absolute;display:grid;grid-template-columns:12px minmax(0,1fr);gap:4px 9px;align-items:start;padding:9px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);text-align:left;transition:opacity .2s,transform .15s var(--ease),border-color .15s}
.mnode:hover{transform:translateY(-1px);border-color:var(--ink-3)}
.mnode .node{margin-top:3px}
.mnode .t{font-size:12.5px;font-weight:500;line-height:1.3;height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mnode .m{grid-column:2;display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.mnode .m .eid{color:var(--ink);font-weight:600}
.mnode .m .pk{color:var(--teal-text)}
.mnode.s-picked{border-color:var(--teal-line);background:color-mix(in srgb,var(--teal) 7%,var(--surface))}
.mnode.s-left{opacity:.62}
.mnode.s-left .t{text-decoration:line-through;text-decoration-color:var(--line-2)}
.mnode.s-landed{background:var(--surface-2)}
.mnode.warn{border-color:var(--verm);box-shadow:0 0 0 3px var(--verm-soft),var(--shadow)}
.mnode.sel{outline:2px solid var(--ink);outline-offset:3px}
.canvas.focused .mnode{opacity:.4}
.canvas.focused .mnode.hl{opacity:1}
.titleblock{position:absolute;right:0;bottom:-104px;display:grid;grid-template-columns:auto auto;border:1px solid var(--line-2);font-family:var(--mono);font-size:10.5px;color:var(--ink-3);background:var(--surface)}
.titleblock div{padding:4px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.titleblock div:nth-child(2n){border-right:0;color:var(--ink)}
.legend{position:sticky;left:16px;bottom:16px;display:inline-flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:0 16px 16px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px;color:var(--ink-2);z-index:2}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:8px}
.insp{border-left:1px solid var(--line);background:var(--pane);overflow:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.insp h3{margin:0;font-size:18px;line-height:1.25;letter-spacing:-.015em}
.insp .lede{font-size:13.5px}
.insp .modes{grid-template-columns:1fr 1fr}
.insp .mb2{height:36px;font-size:13px}
.insp .modes{flex:none}
.insp .batch{flex:none;height:34px}
.insp > .btn{align-self:flex-start}
.insp .hintline{font-size:12px;color:var(--ink-3)}

/* ---------------------------------------------------------------- plan */
.view-plan{overflow:auto;display:none;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.app[data-view="plan"] .view-plan{display:block}
.planin{max-width:1120px;margin:0 auto;padding:30px 28px 60px}
.planhead{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.planhead h2{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:600}
.planhead p{margin:4px 0 0;color:var(--ink-2);font-size:14.5px}
.tally{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.tally div{padding:10px 18px;border-right:1px solid var(--line);min-width:92px}
.tally div:last-child{border-right:0}
.tally b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tally span{font-size:11.5px;color:var(--ink-3)}
.tally .t-p b{color:var(--teal-text)}
.tally .t-w b{color:var(--verm)}
.plangrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px}
.panel + .panel{margin-top:16px}
.panel h3{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;font-weight:600}
.panel h3 .c{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-weight:400}
.panel.attn{border-color:var(--verm-line)}
.panel.attn h3 .i{color:var(--verm)}
.lane{position:relative;padding-left:34px}
.lane::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;border-left:1.5px dashed var(--line-2)}
.bstep{position:relative;padding:2px 0 18px}
.bstep:last-child{padding-bottom:0}
.bnum{position:absolute;left:-34px;top:0;width:24px;height:24px;border-radius:99px;display:grid;place-items:center;background:var(--teal);color:var(--teal-ink);font-family:var(--mono);font-size:11px;font-weight:600;box-shadow:0 0 0 4px var(--surface)}
.bname{font-family:var(--mono);font-size:13.5px;font-weight:600;display:flex;flex-direction:column;gap:1px}
.bname .after{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink-3)}
.bents{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.bent{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 8px;margin:0 -8px;border-radius:7px;text-align:left;font-size:13.5px}
.bent:hover{background:var(--surface-2)}
.bent .rid{font-size:11.5px}
.bent .md{font-family:var(--mono);font-size:11px;color:var(--teal-text);display:flex;align-items:center;gap:4px}
.bwarn{margin-top:6px;font-size:12px;color:var(--verm);display:flex;gap:6px;align-items:center}
.ilist{display:flex;flex-direction:column;gap:2px}
.iitem{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:6px 8px;margin:0 -8px;border-radius:7px;text-align:left;font-size:13.5px;line-height:1.45}
.iitem:hover{background:var(--surface-2)}
.iitem .sub{display:block;font-size:12px;color:var(--ink-3)}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;max-width:100%}
.pill:hover{border-color:var(--line-2)}
.pill .rid{font-size:11px}
.pill .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink-3);font-size:13px;margin:0}
.sendcta{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px 20px;border-radius:12px;background:var(--ink);color:var(--pane)}
.sendcta p{margin:0;font-size:14px;flex:1}
.sendcta p span{opacity:.7}
.sendcta .btn.primary{height:38px;padding:0 16px}

/* ---------------------------------------------------------------- layers: dialogs, menu, toast */
.layer{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--scrim);animation:fade .18s ease}
.layer.menu{background:transparent;place-items:start end;padding:calc(var(--top) - 6px) 12px 0 0;animation:none}
@keyframes fade{from{opacity:0}}
.dialog{width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);animation:dlg .26s var(--ease)}
@keyframes dlg{from{opacity:0;transform:translateY(10px) scale(.985)}}
.dlgh{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 6px}
.dlgh h2{margin:0;font-size:20px;letter-spacing:-.015em;font-weight:600}
.dlgh p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.dlgh .ibtn{margin-left:auto;margin-top:-4px}
.dlgb{padding:12px 24px 24px}
.sumrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.sumrow span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px}
.sumrow span b{font-variant-numeric:tabular-nums}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.callout.w{background:var(--verm-soft);border-color:var(--verm-line);color:var(--ink)}
.callout.w .i{color:var(--verm)}
.bigsend{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border-radius:12px;background:var(--teal);color:var(--teal-ink);font-size:15.5px;font-weight:600;margin-top:6px;transition:filter .15s,transform .1s}
.bigsend:hover{filter:brightness(1.07)}
.bigsend:active{transform:translateY(1px)}
.bigsend.done{background:var(--teal-soft);color:var(--teal-text);box-shadow:inset 0 0 0 1.5px var(--teal-line)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 4px;font-size:12.5px;color:var(--ink-2)}
.steps div{display:flex;gap:8px;align-items:flex-start}
.steps i{font-style:normal;font-family:var(--mono);font-size:11px;display:grid;place-items:center;width:20px;height:20px;border-radius:99px;flex:none;border:1px solid var(--line-2);color:var(--ink-3)}
.steps .on i{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.alt{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-2);align-items:center}
.alt .muted{flex-basis:100%;font-size:12px;margin-bottom:2px}
details.peek{margin-top:12px}
details.peek summary{cursor:pointer;font-size:12.5px;color:var(--ink-3)}
details.peek pre{max-height:220px;overflow:auto;margin:8px 0 0;padding:10px 12px;border-radius:8px;background:var(--sunk);font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap}
.menu .pop{width:270px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;animation:dlg .18s var(--ease)}
.menu .pop button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;font-size:13.5px;text-align:left}
.menu .pop button:hover{background:var(--surface-2)}
.menu .pop button .sub{display:block;font-size:11.5px;color:var(--ink-3)}
.menu .pop hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .pop .danger{color:var(--verm)}
.menu .info{padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--ink-3);line-height:1.7}
.menu .info b{color:var(--ink-2);font-weight:500}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px}
.keys h4{grid-column:1/-1;margin:12px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.keys kbd{margin-left:3px}
.toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:14px;padding:9px 10px 9px 16px;border-radius:12px;background:var(--ink);color:var(--pane);box-shadow:var(--shadow-lg);font-size:13.5px;animation:toast .28s var(--ease);max-width:calc(100vw - 32px)}
.toast button{color:var(--teal);font-weight:600;padding:3px 8px;border-radius:6px}
:root[data-theme="dark"] .toast button{color:var(--teal-ink)}
.toast button:hover{background:color-mix(in srgb,var(--pane) 12%,transparent)}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ---------------------------------------------------------------- responsive */
@media (max-width:1280px){ .saved .lbl{display:none} }
@media (max-width:1180px){ .refs .ref.base, .refs .arrow{display:none} }

<script id="harvest-data" type="application/json">__HARVEST_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('harvest-data').textContent);
const M = DATA.meta, E = DATA.entries, PENDING = DATA.pending || {};
const byId = Object.fromEntries(E.map(e => [e.id, e]));
const dependents = {};
E.forEach(e => e.depends.forEach(d => (dependents[d] = dependents[d] || []).push(e.id)));
const KEY = 'harvest-report:' + (M.head_sha || M.ledger_name) + ':r' + M.round;
const UIKEY = 'harvest-report-ui:' + (M.head_sha || M.ledger_name);
const MODES = ['cherry-pick', 'rework', 'rebuild'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent), MOD = MAC ? 'Cmd' : 'Ctrl', MODK = MAC ? '⌘' : 'Ctrl ';
const plural = (n, w, p) => n + ' ' + (n === 1 ? w : (p || w + 's'));

// ---- icons --------------------------------------------------------------------------------------
const IC = {
  'cherry-pick': '<path d="M2 8h9.5M8 4.5 11.5 8 8 11.5"/><path d="M14 3v10"/>',
  rework: '<path d="M2.8 7.2A5.2 5.2 0 0 1 12 4.6L13.2 6"/><path d="M13.4 2.6V6H10"/><path d="M13.2 8.8A5.2 5.2 0 0 1 4 11.4L2.8 10"/><path d="M2.6 13.4V10H6"/>',
  rebuild: '<rect x="2" y="9" width="5.5" height="4.5" rx="1"/><rect x="8.5" y="9" width="5.5" height="4.5" rx="1"/><rect x="5.25" y="3" width="5.5" height="4.5" rx="1"/>',
  left: '<circle cx="8" cy="8" r="5.6"/><path d="M4 12 12 4"/>',
  warn: '<path d="M8 2.2 14.3 13.3H1.7z"/><path d="M8 6.6v3.1M8 11.6v.01"/>',
  chat: '<path d="M2.5 3.5h11v7.2H7.6L4.6 13v-2.3H2.5z"/>',
  check: '<path d="m3 8.5 3.2 3L13 4.5"/>',
  up: '<path d="m4 10 4-4 4 4"/>', down: '<path d="m4 6 4 4 4-4"/>',
  prev: '<path d="m10 3.5-4.5 4.5 4.5 4.5"/>', next: '<path d="m6 3.5 4.5 4.5L6 12.5"/>',
  close: '<path d="m4 4 8 8M12 4l-8 8"/>',
  scissors: '<circle cx="4" cy="4.5" r="2"/><circle cx="4" cy="11.5" r="2"/><path d="M5.6 5.7 13.5 12M5.6 10.3 13.5 4"/>',
  copy: '<rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1 1 0 0 0 10 2.5H3.5a1 1 0 0 0-1 1V10a1 1 0 0 0 1 1H5"/>',
  download: '<path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M2.5 13.5h11"/>',
  file: '<path d="M4 1.8h5l3.2 3.2V14H4z"/><path d="M9 1.8V5h3.2"/><path d="M6 8.5h4M6 11h4"/>',
  sync: '<path d="M13 6.5A5 5 0 0 0 3.6 5M3 9.5A5 5 0 0 0 12.4 11"/><path d="M3.3 2.5v2.8h2.8M12.7 13.5v-2.8H9.9"/>',
  upload: '<path d="M8 10.5v-8M4.5 6 8 2.5 11.5 6M2.5 13.5h11"/>',
  trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 9h5.8l.6-9"/>',
  sun: '<circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/>',
  info: '<circle cx="8" cy="8" r="6"/><path d="M8 7.2v3.8M8 5v.01"/>',
  spark: '<path d="M8 1.8v3M8 11.2v3M1.8 8h3M11.2 8h3M3.6 3.6l2 2M10.4 10.4l2 2M3.6 12.4l2-2M10.4 5.6l2-2"/>',
  agent: '<path d="M8 2v12M2 8h12M3.8 3.8l8.4 8.4M12.2 3.8l-8.4 8.4"/>',
  link: '<path d="M6.5 9.5 9.5 6.5"/><path d="M7 4.5 8.5 3a2.5 2.5 0 0 1 3.5 3.5L10.5 8M9 11.5 7.5 13A2.5 2.5 0 0 1 4 9.5L5.5 8"/>',
  undo: '<path d="M5.5 3.5 2.5 6.5l3 3"/><path d="M2.5 6.5h7a4 4 0 0 1 0 8H7"/>'
};
const ic = (n, cls) => '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 16 16" aria-hidden="true">' + IC[n] + '</svg>';
const MODE_INFO = {
  'cherry-pick': {label: 'Cherry-pick', key: '1', blurb: "bring head's code over as written"},
  rework: {label: 'Rework', key: '2', blurb: 'keep the intent, refactor the code to fit the yardstick'},
  rebuild: {label: 'Rebuild', key: '3', blurb: 'write a brief, add your enhancements, implement from scratch'},
  left: {label: 'Leave', key: 'X', blurb: 'not coming to base'}
};
const KIND_LABEL = {feature: 'Feature', plumbing: 'Plumbing', headonly: 'Head-only', setaside: 'Already on base'};

// ---- state: the human's draft, separate from the ledger (shape unchanged from v1) ---------------
let S = {entries: {}, general: '', nextQ: 1};
const ui = {sel: null, view: 'review', filter: 'all', q: '', drafts: {}, editing: null, cutOpen: {}, lsOk: true, notices: [],
            fsa: {handle: null, state: 'none', last: null, err: null}, savedAt: null, seen: {}, fresh: {id: null, qids: []},
            theme: 'auto', dismissed: {}, hover: null};

const ledgerEff = e => {
  const s = e.status;
  return s.kind === 'picked' ? {kind: 'picked', mode: s.mode, batch: s.batch || null} : {kind: s.kind};
};
function eff(e) {
  const led = ledgerEff(e);
  if (led.kind === 'landed') return led;
  const st = S.entries[e.id];
  let r = led;
  if (st && st.mode !== undefined) {
    r = st.mode === 'open' ? {kind: 'open'} : st.mode === 'left' ? {kind: 'left'}
      : {kind: 'picked', mode: st.mode, batch: led.kind === 'picked' ? led.batch : null};
  }
  if (r.kind === 'picked' && st && st.batch !== undefined) r = Object.assign({}, r, {batch: st.batch || null});
  return r;
}
const decidable = e => ledgerEff(e).kind !== 'landed';
const defaultBatch = t => t.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().split(/\s+/).slice(0, 4).join('-');
const batchName = e => eff(e).batch || defaultBatch(e.title);
const get = id => (S.entries[id] = S.entries[id] || {});
function prune(id) {
  const st = S.entries[id]; if (!st) return;
  if (st.comments && !st.comments.length) delete st.comments;
  if (st.cuts) { Object.keys(st.cuts).forEach(k => { if (!st.cuts[k].trim()) delete st.cuts[k]; }); if (!Object.keys(st.cuts).length) delete st.cuts; }
  if (!Object.keys(st).length) delete S.entries[id];
}
function setMode(id, m) {
  const e = byId[id], cur = eff(e), st = get(id), led = ledgerEff(e);
  const same = (m === 'left' && cur.kind === 'left') || (cur.kind === 'picked' && cur.mode === m);
  st.mode = same ? 'open' : m;
  const now = st.mode === 'open' ? {kind: 'open'} : st.mode === 'left' ? {kind: 'left'} : {kind: 'picked', mode: st.mode};
  if (now.kind === led.kind && now.mode === led.mode) delete st.mode;
  prune(id);
}
function isChanged(e) {
  const f = eff(e), led = ledgerEff(e);
  return f.kind !== led.kind || f.mode !== led.mode || (f.kind === 'picked' && (f.batch || null) !== (led.batch || null));
}
function warnings() {
  const w = [];
  E.forEach(e => {
    if (eff(e).kind !== 'picked') return;
    e.depends.forEach(d => {
      const k = eff(byId[d]).kind;
      if (k === 'picked' || k === 'landed') return;
      const how = ((S.entries[e.id] || {}).cuts || {})[d] || '', led = (e.cuts || {})[d] || '';
      w.push({from: e.id, dep: d, state: k, cut: (how || led).trim(), ledgerCut: !how.trim() && !!led});
    });
  });
  return w;
}
function depReasons(e) {
  const out = {}, re = /\b(F\d+|S\d+|Plumbing|Head-only)\b\s*(\(([^()]*)\))?/g; let m;
  while ((m = re.exec(e.depends_raw || ''))) if (m[3] && !out[m[1]]) out[m[1]] = m[3];
  return out;
}
const stateOf = e => { const f = eff(e); return e.kind === 'setaside' ? 'aside' : f.kind; };
const answeredNotes = e => e.notes.filter(n => n.kind === 'question' && n.answer && n.qid);
const freshAnswers = e => M.ingested_round ? answeredNotes(e).filter(n => n.round === M.ingested_round) : [];
const unseen = e => freshAnswers(e).filter(n => !ui.seen[n.qid]);

// ---- responses (see responses.schema.md; unchanged from v1) --------------------------------------
function buildResponses() {
  const out = {};
  E.forEach(e => {
    const st = S.entries[e.id]; if (!st) return;
    const o = {title: e.title, status: e.status_raw}, led = ledgerEff(e);
    if (led.kind !== 'landed') {
      const cur = eff(e);
      const modeChanged = cur.kind !== led.kind || cur.mode !== led.mode;
      if (modeChanged) o.mode = cur.kind === 'picked' ? cur.mode : cur.kind;
      if (cur.kind === 'picked' && (modeChanged || (cur.batch || null) !== (led.batch || null))) o.batch = cur.batch || null;
    }
    const cuts = Object.entries(st.cuts || {}).filter(([d, h]) => h.trim() && e.depends.includes(d)).map(([dep, how]) => ({dep, how: how.trim()}));
    if (cuts.length) o.cuts = cuts;
    if ((st.comments || []).length) o.comments = st.comments.map(c => ({id: c.id, kind: c.kind, text: c.text, created: c.created}));
    if (Object.keys(o).length > 2) out[e.id] = o;
  });
  return {
    schema: 'harvest-responses/1', round: M.round, created: new Date().toISOString(),
    ledger: {name: M.ledger_name, sha256: M.ledger_sha256, head: M.head, head_sha: M.head_sha, base: M.base, base_sha: M.base_sha, updated: M.updated},
    entries: out, general_notes: (S.general || '').trim()
  };
}
const respText = () => JSON.stringify(buildResponses(), null, 2);
function tallies() {
  const W = warnings(), un = W.filter(w => !w.cut);
  const dec = E.filter(decidable);
  const c = {picked: 0, left: 0, open: 0};
  dec.forEach(e => c[eff(e).kind]++);
  const landed = E.filter(e => !decidable(e) && e.kind !== 'setaside').length, aside = E.filter(e => e.kind === 'setaside').length;
  const com = Object.values(S.entries).flatMap(s => s.comments || []);
  const nq = com.filter(x => x.kind === 'question').length;
  const changes = E.filter(e => decidable(e) && isChanged(e)).length;
  const resp = buildResponses();
  return {W, un, dec: dec.length, decided: c.picked + c.left, picked: c.picked, left: c.left, open: c.open, landed, aside,
          nq, nn: com.length - nq, changes, touched: Object.keys(resp.entries).length + (resp.general_notes ? 1 : 0)};
}
function plan() {
  const groups = new Map();
  E.forEach(e => { if (eff(e).kind === 'picked') { const n = batchName(e); if (!groups.has(n)) groups.set(n, []); groups.get(n).push(e); } });
  const names = [...groups.keys()], after = {};
  names.forEach(n => {
    after[n] = new Set();
    groups.get(n).forEach(e => e.depends.forEach(d => { const t = byId[d]; if (eff(t).kind === 'picked' && batchName(t) !== n) after[n].add(batchName(t)); }));
  });
  const order = [], done = new Set(); let guard = 0, cyc = false;
  while (order.length < names.length && guard++ < 500) {
    const next = names.find(n => !done.has(n) && [...after[n]].every(a => done.has(a)));
    if (!next) { cyc = true; const n = names.find(x => !done.has(x)); order.push(n); done.add(n); continue; }
    order.push(next); done.add(next);
  }
  return {order, groups, after, cyc};
}

// ---- persistence: localStorage draft, optional file via File System Access ----------------------
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      S = Object.assign({entries: {}, general: '', nextQ: 1}, d.state);
      const gone = Object.keys(S.entries).filter(id => !byId[id]);
      gone.forEach(id => delete S.entries[id]);
      if (d.ledger_sha256 !== M.ledger_sha256) ui.notices.push('Your draft was started against a different render of the ledger' + (gone.length ? '; marks for ' + gone.join(', ') + ' were dropped (no longer in the ledger)' : '') + '.');
      ui.savedAt = d.saved;
    }
  } catch (err) { ui.lsOk = false; }
  try {
    const u = JSON.parse(localStorage.getItem(UIKEY) || '{}');
    ui.seen = u.seen || {}; ui.theme = u.theme || 'auto'; ui.dismissed = u.dismissed || {};
    if (u.sel && u.sel[M.round] && byId[u.sel[M.round]]) ui.sel = u.sel[M.round];
    ui.uiSel = u.sel || {};
  } catch (err) { ui.uiSel = {}; }
}
function persist() {
  try {
    ui.savedAt = new Date().toISOString();
    localStorage.setItem(KEY, JSON.stringify({v: 1, ledger_sha256: M.ledger_sha256, saved: ui.savedAt, state: S}));
    ui.lsOk = true;
  } catch (err) { ui.lsOk = false; }
  scheduleFsa();
}
function persistUi() {
  try { ui.uiSel = ui.uiSel || {}; ui.uiSel[M.round] = ui.sel; localStorage.setItem(UIKEY, JSON.stringify({seen: ui.seen, theme: ui.theme, dismissed: ui.dismissed, sel: ui.uiSel})); } catch (err) {}
}
const idb = {
  open: () => new Promise((res, rej) => { const r = indexedDB.open('harvest-report', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('h').objectStore('h').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};
let fsaTimer = null;
function scheduleFsa() { if (ui.fsa.state !== 'on') return; clearTimeout(fsaTimer); fsaTimer = setTimeout(fsaWrite, 500); }
async function fsaWrite() {
  try {
    const w = await ui.fsa.handle.createWritable();
    await w.write(respText()); await w.close();
    ui.fsa.last = new Date(); ui.fsa.err = null;
  } catch (err) { ui.fsa.err = String(err.message || err); ui.fsa.state = 'lost'; }
  renderSaved();
}
async function fsaPick() {
  try {
    const h = await window.showSaveFilePicker({suggestedName: fileName(), types: [{description: 'JSON', accept: {'application/json': ['.json']}}]});
    ui.fsa.handle = h; ui.fsa.state = 'on';
    try { await idb.set(KEY, h); } catch (e) {}
    await fsaWrite();
    toast('Keeping ' + h.name + ' in sync. Tell the agent where it is.');
  } catch (err) { if (err.name !== 'AbortError') ui.fsa.err = String(err.message || err); }
  renderSaved();
}
async function fsaReconnect() {
  try {
    const p = await ui.fsa.handle.requestPermission({mode: 'readwrite'});
    if (p === 'granted') { ui.fsa.state = 'on'; await fsaWrite(); }
  } catch (err) { ui.fsa.err = String(err.message || err); }
  renderSaved();
}
async function fsaRestore() {
  if (!window.showSaveFilePicker) return;
  try {
    const h = await idb.get(KEY); if (!h) return;
    ui.fsa.handle = h;
    const p = await h.queryPermission({mode: 'readwrite'});
    ui.fsa.state = p === 'granted' ? 'on' : 'ask';
    if (ui.fsa.state === 'on') await fsaWrite();
  } catch (err) { /* handle unusable: pick again */ }
  renderSaved();
}
function importState(r) {
  if (!r || r.schema !== 'harvest-responses/1') throw new Error('not a harvest-responses/1 file');
  const ns = {entries: {}, general: r.general_notes || '', nextQ: 1};
  let maxQ = 0;
  Object.entries(r.entries || {}).forEach(([id, o]) => {
    if (!byId[id]) { ui.notices.push('Import skipped ' + id + ': not in this ledger.'); return; }
    const st = {};
    if (o.mode) st.mode = o.mode;
    if (o.batch !== undefined && o.batch !== null) st.batch = o.batch;
    if (o.cuts && o.cuts.length) { st.cuts = {}; o.cuts.forEach(c => st.cuts[c.dep] = c.how); }
    if (o.comments && o.comments.length) {
      st.comments = o.comments.slice();
      o.comments.forEach(c => { const m = /\.q(\d+)$/.exec(c.id || ''); if (m) maxQ = Math.max(maxQ, +m[1]); });
    }
    ns.entries[id] = st;
  });
